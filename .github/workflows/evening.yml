# 매일 11:13 UTC(20:13 KST) — 골드박스 재조회(API 1회) 후 아침보다 안 오른 것만 텔레그램. 없으면 안 보냄.
# Secrets: TELEGRAM_BOT_TOKEN · TELEGRAM_CHANNEL_ID · (선택) SITE_URL. 토큰 없으면 드라이런만 찍고 끝.
name: evening

on:
  schedule:
    - cron: "13 11 * * *"   # 20:13 KST — 정각 회피
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync
      - name: 텔레그램 저녁 (골드박스 재조회 후, 안 오른 것만)
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: uv run python scripts/notify_telegram.py pm
