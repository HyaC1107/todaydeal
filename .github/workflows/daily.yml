# 매일 00:00 UTC(09:00 KST) 수집 → data/ 커밋 → (워드프레스 게시) → 정적 사이트 GitHub Pages 배포
#
# 워드프레스 게시는 Secrets에 WP_URL 이 있을 때만 돈다. 없으면 건너뛰고 Pages만 배포한다.
# 필요한 Secrets: COUPANG_ACCESS_KEY · COUPANG_SECRET_KEY · (선택) WP_URL · WP_USER · WP_APP_PASSWORD
name: daily

on:
  schedule:
    # 00:00 UTC 정각은 GitHub 크론이 가장 밀리는 슬롯(2026-09-10 실측: 48분 지나도 미실행) → 정각 회피
    - cron: "17 0 * * *"   # 09:17 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]   # 봇의 data 커밋으로 다시 도는 루프 방지 — 코드 변경만 재배포

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      HAS_WP: ${{ secrets.WP_URL != '' }}
      HAS_TG: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync

      - name: 수집 + 정적 사이트 생성
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: uv run python scripts/daily.py

      - name: 워드프레스 게시 (WP_URL 있을 때만)
        if: env.HAS_WP == 'true'
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: uv run python scripts/post_wp.py

      - name: 텔레그램 아침 (오늘의 3개, 토큰 있을 때만)
        if: env.HAS_TG == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: uv run python scripts/notify_telegram.py am

      - name: 가격·순위 이력·스냅샷 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data: $(date +%Y-%m-%d) 수집"
            git push
          fi

      - uses: actions/upload-pages-artifact@v7
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
