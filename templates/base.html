<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site }}{% endblock %}</title>
<meta name="description" content="{% block desc %}매일 아침 9시, 쿠팡 골드박스와 카테고리별 베스트를 가격·순위 변동과 함께.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ root }}style.css">
</head>
<body>
<div class="wrap">
  <nav class="top"><a class="logo" href="{{ root }}index.html"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="22" cy="24" r="9" fill="#FF7A6E" stroke="#1E1B2E" stroke-width="3"/><circle cx="58" cy="24" r="9" fill="#FF7A6E" stroke="#1E1B2E" stroke-width="3"/><circle cx="22" cy="24" r="4" fill="#FFB3C1"/><circle cx="58" cy="24" r="4" fill="#FFB3C1"/><ellipse cx="40" cy="48" rx="29" ry="26" fill="#FF7A6E" stroke="#1E1B2E" stroke-width="3"/><ellipse cx="40" cy="58" rx="16" ry="11" fill="#FFF6E8" opacity=".85"/><circle cx="30" cy="44" r="4.2" fill="#1E1B2E"/><circle cx="50" cy="44" r="4.2" fill="#1E1B2E"/><circle cx="31.6" cy="42.4" r="1.4" fill="#fff"/><circle cx="51.6" cy="42.4" r="1.4" fill="#fff"/><circle cx="40" cy="51" r="2.6" fill="#FF8FA3" stroke="#1E1B2E" stroke-width="1.5"/><path d="M35 55 q2.5 3.5 5 0 q2.5 3.5 5 0" fill="none" stroke="#1E1B2E" stroke-width="2.2" stroke-linecap="round"/><path d="M12 48 L24 50 M12 54 L24 53 M68 48 L56 50 M68 54 L56 53" stroke="#1E1B2E" stroke-width="1.8" stroke-linecap="round"/><circle cx="64" cy="18" r="11" fill="#FFD84D" stroke="#1E1B2E" stroke-width="3"/><text x="64" y="23" text-anchor="middle" font-size="13">🛒</text></svg>{{ site }}</a><span class="tag"><a class="home" href="https://hyac1107.github.io/">🐹 또리 로그</a><span>매일 09:17 갱신</span></span></nav>
  <nav class="tabs" aria-label="카테고리">
    <a href="{{ root }}index.html" class="{% if active == 'home' %}on{% endif %}">오늘</a>
    <a href="{{ root }}c/goldbox.html" class="{% if active == 'goldbox' %}on{% endif %}">골드박스</a>
    {% for t in tabs %}<a href="{{ root }}c/{{ t.slug }}.html" class="{% if active == t.slug %}on{% endif %}">{{ t.label }}</a>{% endfor %}
  </nav>
  <p class="disc-top">{{ disclosure_top }}</p>
  {% block body %}{% endblock %}
  <footer class="disclosure">{{ disclosure }} {{ obs_note }} 가격은 게시 시점 기준이며 변동될 수 있습니다. 상품 정보·이미지는 쿠팡 파트너스 API가 제공합니다.</footer>
</div>
</body>
</html>
